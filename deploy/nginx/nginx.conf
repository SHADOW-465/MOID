# Single LAN front door: UI + Supabase-compatible /rest/v1 → PostgREST.
# Not internet-facing by design (air-gapped plant appliance).

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 64m;
  server_tokens off;

  # Optional basic edge headers (app auth remains as-is for pilot).
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream moid_app {
    server app:3000;
  }

  upstream moid_rest {
    server rest:3000;
  }

  server {
    listen 80;
    server_name _;

    # Health for load balancers / compose healthchecks
    location = /healthz {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    # PostgREST behind the path supabase-js expects
    location /rest/v1/ {
      proxy_pass http://moid_rest/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_hide_header X-Powered-By;
    }

    # Next.js app (everything else)
    location / {
      proxy_pass http://moid_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 300s;
    }
  }
}
